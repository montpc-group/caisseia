name: Publish to npm

# DRAFT — not enabled. Security review required before this repository is pushed.
#
# Triggered by a tag matching v* (e.g. v1.0.0-rc.3). A maintainer pushes the tag only
# after sign-off on the exact version string. The `npm-publish` environment must be
# configured with required reviewers, so a tag alone never publishes.
#
# Two jobs:
#   build   — installs dependencies, tests, builds and packs the tarball. No id-token.
#   publish — downloads that tarball and publishes it. No checkout, no dependency
#             install, no project code run. Only job with id-token (npm trusted
#             publishing via OIDC, no npm token stored anywhere).
#
# npm trusted publishing needs, on npmjs.com, a trusted publisher for this package
# bound to this repository, this workflow file and the `npm-publish` environment.
# Provenance also needs package.json `repository.url` to match this repository.
#
# Every action is pinned by full commit SHA; the tag is in the comment.

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    name: Test, build, pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Check package name, repository and tag
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_REPO="$(node -p "(require('./package.json').repository || {}).url || ''")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_NAME" = "PKGNAME" ]; then
            echo "::error::package name is still the PKGNAME placeholder"
            exit 1
          fi
          if [ -z "$PKG_REPO" ]; then
            echo "::error::package.json repository.url is required for npm provenance"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match package.json '$PKG_VERSION'"
            exit 1
          fi
          echo "Building $PKG_NAME@$PKG_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Postgres tests (Docker)
        run: pnpm test:postgres

      - name: Build
        run: pnpm build

      - name: Pack
        run: |
          mkdir -p out
          pnpm pack --pack-destination out
          ls -l out
          sha256sum out/*.tgz

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      id-token: write # npm trusted publishing (OIDC) + provenance

    steps:
      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: out

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      # Trusted publishing needs npm >= 11.5.1; this is the only code fetched in this job.
      - name: Pin npm
        run: npm install -g npm@11.6.0 --ignore-scripts

      - name: Publish
        run: |
          set -euo pipefail
          sha256sum out/*.tgz
          npm publish out/*.tgz --provenance --access public --ignore-scripts
